  <a class="back" href="../">← Alexei Selivanov</a>

  <h2 class="hug">Magad Store</h2>
  <p>
    Customer-facing iOS app of the <a target="_blank" href="https://www.magad.app">Magad</a> B2B wholesale storefront:
    live stock, quantity-tiered prices and offer/counter-offer price negotiation.
    The App Store screenshots, demo data.
  </p>

  <div class="screens">
    <figure><img src="1-catalog.png" width="642" height="1389" alt="Catalog" loading="lazy" /><figcaption><b>Catalog</b><br /><span class="muted">Categories and products with live stock and “from” prices</span></figcaption></figure>
